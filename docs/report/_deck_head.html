<title>Draft-Aligned SDAR, from first principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --paper:#DDE3E1; --stage:#F7F9F8; --ink:#16211F; --ink-2:#3A4744; --muted:#6E7B78;
    --rule:#C9D2CF; --mask:#9FACA8; --draft:#B4762E; --draft-soft:#F1E2CC;
    --commit:#1B6A60; --commit-soft:#D5E6E2; --wrong:#A33329; --wrong-soft:#F2DAD6;
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:"Source Serif 4",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#070C0B; --stage:#101A18; --ink:#E7EDEA; --ink-2:#BFCCC8; --muted:#8B9995;
      --rule:#2C3B38; --mask:#54625E; --draft:#E2A664; --draft-soft:#3A2E1D;
      --commit:#57B7A7; --commit-soft:#16332F; --wrong:#E4776B; --wrong-soft:#3A1F1C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#070C0B; --stage:#101A18; --ink:#E7EDEA; --ink-2:#BFCCC8; --muted:#8B9995;
    --rule:#2C3B38; --mask:#54625E; --draft:#E2A664; --draft-soft:#3A2E1D;
    --commit:#57B7A7; --commit-soft:#16332F; --wrong:#E4776B; --wrong-soft:#3A1F1C;
  }

  html,body{height:100%;margin:0;overflow:hidden;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}

  #stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;
    background:var(--stage);box-shadow:0 24px 70px rgba(0,0,0,.22);overflow:hidden;
    display:flex;flex-direction:column;}

  .topbar{height:40px;flex:0 0 40px;border-bottom:1px solid var(--rule);
    display:flex;align-items:center;gap:16px;padding:0 52px;
    font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}
  .topbar .brand{color:var(--ink);font-family:var(--display);font-weight:800;font-size:15px;
    letter-spacing:-0.01em;text-transform:none;white-space:nowrap;}
  .topbar .chapter{color:var(--commit);font-weight:600;font-size:10.5px;letter-spacing:.13em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;}
  .topbar .counter{font-family:var(--mono);font-size:11.5px;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap;}

  .frames{position:relative;flex:1 1 auto;min-height:0;}
  .slide{position:absolute;inset:0;padding:26px 60px 30px;overflow:hidden;
    opacity:0;visibility:hidden;transition:opacity .24s ease;}
  .slide.on{opacity:1;visibility:visible;}
  .slide-inner{display:flex;flex-direction:column;gap:11px;width:100%;
    justify-content:center;transform-origin:top left;}
  .eyebrow{display:none;}
  @media (prefers-reduced-motion: reduce){ .slide{transition:none;} }

  h2{font-family:var(--display);font-weight:700;font-size:35px;line-height:1.04;margin:0;letter-spacing:-0.018em;}
  h2.sm{font-size:32px;}
  .lede{font-size:19.5px;line-height:1.42;color:var(--ink-2);margin:0;max-width:96ch;}
  .kicker{font-size:17.5px;line-height:1.42;margin:0;max-width:104ch;}
  .kicker.sm{font-size:16.5px;}
  strong{font-weight:600;color:var(--ink);}
  em{font-style:italic;}

  .figbox{flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
  .figbox svg{width:100%;height:auto;max-height:100%;display:block;}

  .cols{flex:0 1 auto;min-height:0;display:grid;grid-template-columns:560px 1fr;gap:28px;align-items:start;}
  .cols.wide-left{grid-template-columns:640px 1fr;}
  .stack{display:flex;flex-direction:column;gap:11px;min-width:0;}

  ul.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  ul.points li{padding-left:20px;position:relative;font-size:16.5px;line-height:1.38;}
  ul.points li::before{content:"";position:absolute;left:0;top:.66em;width:11px;height:1px;background:var(--commit);}

  .num-strip{display:flex;border-top:1px solid var(--rule);border-left:1px solid var(--rule);flex:0 0 auto;}
  .num-strip div{flex:1 1 0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 12px;}
  .num-strip .v{font-family:var(--mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;
    color:var(--ink);line-height:1.2;}
  .num-strip .v small{font-size:13px;color:var(--muted);font-weight:400;}
  .num-strip .k{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-top:4px;}

  table{border-collapse:collapse;width:100%;font-size:15px;table-layout:auto;}
  th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--rule);
    white-space:normal;overflow-wrap:anywhere;vertical-align:top;}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);font-weight:500;border-bottom:1px solid var(--ink);}
  tbody td{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  tbody td:first-child{font-family:var(--body);font-size:16px;}
  tr.hero td{background:var(--commit-soft);}
  tr.dead td{color:var(--muted);}

  .callout{border-left:3px solid var(--draft);background:var(--draft-soft);padding:10px 16px;
    font-size:16.5px;line-height:1.4;color:var(--ink);flex:0 0 auto;}
  .callout.good{border-left-color:var(--commit);background:var(--commit-soft);}
  .callout.bad{border-left-color:var(--wrong);background:var(--wrong-soft);}
  .callout b{font-family:var(--display);font-weight:700;}

  .eq{font-family:var(--mono);font-size:15px;line-height:1.68;background:var(--paper);
    border-left:3px solid var(--muted);padding:10px 16px;flex:0 0 auto;white-space:pre;
    overflow-x:auto;max-width:100%;}
  .lede,.kicker,ul.points li,.callout,figcaption{overflow-wrap:break-word;}
  .stack,.cols,.figbox{min-width:0;}
  .eq .c{color:var(--muted);}

  figcaption{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5;flex:0 0 auto;}

  .ticks{display:flex;gap:3px;align-items:center;flex:0 0 auto;}
  .ticks button{appearance:none;border:none;background:var(--rule);padding:0;cursor:pointer;
    width:14px;height:3px;transition:background .18s ease,height .18s ease;}
  .ticks button:hover{background:var(--muted);}
  .ticks button[aria-current="true"]{background:var(--commit);height:7px;}
  .ticks button:focus-visible{outline:2px solid var(--commit);outline-offset:3px;}
</style>

<div id="stage">
  <div class="topbar">
    <span class="brand">Draft-Aligned SDAR</span>
    <span class="chapter" id="chapter"></span>
    <div class="ticks" id="ticks"></div>
    <span class="counter" id="counter">01 / 35</span>
  </div>
  <div class="frames">
