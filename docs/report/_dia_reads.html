<figure>
<svg class="dia" viewBox="0 0 920 300" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Three ways to read an opinion about a draft token out of the frozen model: draft in place returns the next token, complementary halves returns a sycophantic confirmation, and the empty-block marginal returns a weak but honest signal.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B84A00"/>
    </marker>
  </defs>

  <!-- ============ panel A ============ -->
  <g transform="translate(0,0)">
    <text x="0" y="14" font-size="13" font-weight="600" fill="currentColor">A · draft in place</text>
    <text x="0" y="32" font-size="11.5" fill="currentColor" opacity=".65">every slot holds the draft token; read slot i</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="0"  y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <rect x="50" y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <rect x="100" y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="2.2" rx="2"/>
      <rect x="150" y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <rect x="200" y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <text x="23"  y="64" text-anchor="middle" fill="currentColor">her</text>
      <text x="73"  y="64" text-anchor="middle" fill="currentColor">rate</text>
      <text x="123" y="64" text-anchor="middle" fill="currentColor">is</text>
      <text x="173" y="64" text-anchor="middle" fill="currentColor">$</text>
      <text x="223" y="64" text-anchor="middle" fill="currentColor">18</text>
    </g>
    <text x="123" y="90" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".6">slot i</text>
    <path d="M123,96 L123,112 L173,112 L173,80" stroke="#B84A00" stroke-width="1.4" fill="none" marker-end="url(#arB)"/>
    <text x="150" y="128" font-size="11.5" text-anchor="middle" fill="#B84A00">outputs slot i+1</text>
    <line x1="0" y1="150" x2="262" y2="150" stroke="currentColor" opacity=".25"/>
    <text x="0" y="172" font-size="12.5" font-weight="600" fill="currentColor">84.8% next token</text>
    <text x="0" y="192" font-size="11.5" fill="currentColor" opacity=".75">10.0% its own token</text>
    <text x="0" y="216" font-size="11.5" fill="currentColor" opacity=".75">The Qwen3 next-token head</text>
    <text x="0" y="232" font-size="11.5" fill="currentColor" opacity=".75">survives where diffusion</text>
    <text x="0" y="248" font-size="11.5" fill="currentColor" opacity=".75">training never looked.</text>
    <text x="0" y="276" font-size="11.5" font-weight="600" fill="#A3341A">Not a judgement.</text>
  </g>

  <!-- ============ panel B ============ -->
  <g transform="translate(328,0)">
    <text x="0" y="14" font-size="13" font-weight="600" fill="currentColor">B · complementary halves</text>
    <text x="0" y="32" font-size="11.5" fill="currentColor" opacity=".65">judged slot masked, draft around it</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="0"  y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <rect x="50" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <rect x="100" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="2.2" rx="2"/>
      <rect x="150" y="46" width="46" height="28" fill="none" stroke="#B84A00" stroke-width="1.2" rx="2"/>
      <rect x="200" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <text x="23"  y="64" text-anchor="middle" fill="currentColor">her</text>
      <text x="73"  y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="123" y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="173" y="64" text-anchor="middle" fill="currentColor">$</text>
      <text x="223" y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
    </g>
    <text x="123" y="90" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".6">slot i, masked</text>
    <path d="M123,96 L123,120" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <text x="123" y="136" font-size="11.5" text-anchor="middle" fill="currentColor">confident, and agrees</text>
    <line x1="0" y1="150" x2="262" y2="150" stroke="currentColor" opacity=".25"/>
    <text x="0" y="172" font-size="12.5" font-weight="600" fill="currentColor">92% agrees with the draft</text>
    <text x="0" y="192" font-size="11.5" fill="currentColor" opacity=".75">confirms 76% of WRONG drafts</text>
    <text x="0" y="212" font-size="11.5" fill="currentColor" opacity=".75">corrects a wrong draft: 1.2%</text>
    <text x="0" y="236" font-size="11.5" fill="currentColor" opacity=".75">Feed it the model's own</text>
    <text x="0" y="252" font-size="11.5" fill="currentColor" opacity=".75">incoherent guesses: 6.6%.</text>
    <text x="0" y="276" font-size="11.5" font-weight="600" fill="#A3341A">Trusts fluency, not truth.</text>
  </g>

  <!-- ============ panel C ============ -->
  <g transform="translate(656,0)">
    <text x="0" y="14" font-size="13" font-weight="600" fill="currentColor">C · empty-block marginal</text>
    <text x="0" y="32" font-size="11.5" fill="currentColor" opacity=".65">the pass it runs anyway; draft never shown</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="0"  y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <rect x="50" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <rect x="100" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="2.2" rx="2"/>
      <rect x="150" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <rect x="200" y="46" width="46" height="28" fill="none" stroke="#2C7FB8" stroke-width="1.2" rx="2"/>
      <text x="23"  y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="73"  y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="123" y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="173" y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
      <text x="223" y="64" text-anchor="middle" fill="#2C7FB8">▨</text>
    </g>
    <text x="123" y="90" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".6">slot i</text>
    <path d="M123,96 L123,120" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <text x="123" y="136" font-size="11.5" text-anchor="middle" fill="currentColor">read q = p(draft token)</text>
    <line x1="0" y1="150" x2="262" y2="150" stroke="currentColor" opacity=".25"/>
    <text x="0" y="172" font-size="12.5" font-weight="600" fill="#00806A">honest, and free</text>
    <text x="0" y="192" font-size="11.5" fill="currentColor" opacity=".75">q &gt; 0.5 takes 4.7 slots/block</text>
    <text x="0" y="212" font-size="11.5" fill="currentColor" opacity=".75">at 0.91 precision</text>
    <text x="0" y="236" font-size="11.5" fill="currentColor" opacity=".75">But it is still a MARGINAL:</text>
    <text x="0" y="252" font-size="11.5" fill="currentColor" opacity=".75">it never sees the draft, so</text>
    <text x="0" y="268" font-size="11.5" fill="currentColor" opacity=".75">it stays flat where phrasing</text>
    <text x="0" y="284" font-size="11.5" fill="currentColor" opacity=".75">is free. Weak by construction.</text>
  </g>
</svg>
<figcaption><b>The three readouts available on the frozen model.</b> Orange outlines are slots holding a
token, blue are <code>[MASK]</code>; the thick outline is the slot being read. Only C is uncontaminated,
and only C survives to become the training-free baseline &mdash; but C is exactly the flat marginal of
section 2, so it can never be strong. A and B are the two ways of showing the model the draft, and both
fail: A returns the next input token, B returns agreement. The trained judge exists to make A's position
&mdash; reading a filled slot &mdash; return an actual verdict.
<span class="tag t-act">actual</span> 87 items, 537 blocks, 15,782 slots,
<code>code/draftalign/probe_ab.py</code>.</figcaption>
</figure>
